<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13161d" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/highlight/atom-one-dark.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <title>PR Studio</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">⌥</span>
        <span class="brand-name">PR&nbsp;Studio</span>
      </div>
      <form class="open-pr" id="openForm">
        <input
          id="prInput"
          class="pr-input"
          type="text"
          placeholder="Paste a PR URL or owner/repo#123, then Enter"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn" type="submit">Open</button>
        <div class="my-prs-wrap">
          <button class="btn" id="myPrsBtn" type="button" title="Show open PRs you're involved in">
            My PRs <span class="my-prs-caret">▾</span>
          </button>
          <div class="my-prs-panel" id="myPrsPanel" hidden></div>
        </div>
      </form>
      <div class="status-wrap">
        <button class="status" id="status" type="button" title="Connection status" aria-label="Setup status"></button>
        <div class="status-popover" id="statusPopover" hidden></div>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main class="stage" id="stage">
      <section class="empty" id="empty">
        <div class="empty-art">⟋⟍</div>
        <h1>No pull request open</h1>
        <p>Paste a GitHub PR link above to start reviewing. Open several — each becomes a tab.</p>
      </section>
      <section class="review" id="review" hidden></section>
    </main>

    <section class="console" id="console" aria-label="Claude Code agent">
      <div class="console-resize" id="consoleResize" title="Drag to resize"></div>
      <div class="console-head">
        <span class="console-glyph">◗</span>
        <span class="console-label">Claude Code</span>
        <div class="console-controls">
          <input
            id="repoPath"
            class="repo-path"
            type="text"
            placeholder="/path/to/local/checkout"
            autocomplete="off"
            spellcheck="false"
          />
          <input
            id="checkCmd"
            class="repo-path check-cmd"
            type="text"
            placeholder="test/lint command"
            autocomplete="off"
            spellcheck="false"
            title="Command run for checks (auto-detected; editable)"
          />
          <button class="btn ghost" id="runChecks" type="button">Run checks</button>
          <button class="btn ghost" id="newChat" type="button" title="Start a fresh conversation — the agent forgets prior turns in this tab">New chat</button>
          <button class="btn ghost" id="clearConsole" type="button">Clear</button>
        </div>
      </div>
      <div class="console-out messages" id="consoleOut"></div>
      <div class="pin-chips" id="pinChips" hidden></div>
      <form class="console-in" id="agentForm">
        <span class="prompt-glyph">›</span>
        <textarea
          id="agentInput"
          class="agent-input"
          rows="1"
          placeholder="Task the agent — e.g. address the review comments in src/auth.js"
          autocomplete="off"
        ></textarea>
        <span class="working-indicator" id="workingIndicator" hidden>
          <span class="working-indicator-dot"></span>Claude is working…
        </span>
        <span class="agent-status" id="agentStatus" aria-live="polite"></span>
        <button class="btn ghost" id="addrCommentsBtn" type="button">Address PR comments</button>
        <button class="btn accent" id="agentRun" type="submit">Run</button>
        <button class="btn stop" id="agentStop" type="button" hidden>Stop</button>
      </form>
    </section>

    <script src="/vendor/marked/marked.umd.js"></script>
    <script src="/vendor/highlight/highlight.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
